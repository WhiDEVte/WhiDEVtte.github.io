<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 탭 - 시작 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="top-nav">
    <div class="nav-left">
      <!-- 서울디지털대학교 로고 (홈페이지 연결 링크) -->
      <a href="https://www.sdu.ac.kr" target="_blank" rel="noopener noreferrer" class="sdu-logo-link" title="서울디지털대학교 홈페이지 바로가기" aria-label="서울디지털대학교 홈페이지 바로가기">
        <div class="sdu-logo-badge">
          <!-- SDU 디지털 심볼 아이콘 -->
          <svg viewBox="0 0 36 36" width="30" height="30" class="sdu-symbol" aria-hidden="true">
            <defs>
              <linearGradient id="sduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0066CC"/>
                <stop offset="100%" stop-color="#002B7A"/>
              </linearGradient>
            </defs>
            <rect width="36" height="36" rx="9" fill="url(#sduGrad)"/>
            <!-- SDU 모노그램 및 비상하는 날개 모티브 -->
            <path d="M9 13.5C9 11.5 10.5 10 12.5 10h4c2 0 3.5 1.5 3.5 3.5v.5h-3.5v-.5c0-.3-.2-.5-.5-.5h-3c-.3 0-.5.2-.5.5v1.2c0 .3.2.5.5.5h3.5c2.2 0 4 1.8 4 4v1.8c0 2-1.5 3.5-3.5 3.5h-4.5c-2 0-3.5-1.5-3.5-3.5V20h3.5v.5c0 .3.2.5.5.5h3.5c.3 0 .5-.2.5-.5v-1.8c0-.3-.2-.5-.5-.5h-3.5C9.8 18.2 9 16.4 9 14.5v-1z" fill="#FFFFFF"/>
            <path d="M22 10h3c2.8 0 5 2.2 5 5v6c0 2.8-2.2 5-5 5h-3V10zm3.5 12.5c.8 0 1.5-.7 1.5-1.5v-6c0-.8-.7-1.5-1.5-1.5H25v9h.5z" fill="#FFFFFF"/>
            <circle cx="28" cy="8.5" r="2.5" fill="#00E5FF"/>
          </svg>
          <div class="sdu-text-group">
            <span class="sdu-brand-en">SDU</span>
            <span class="sdu-brand-kr">서울디지털대학교</span>
          </div>
        </div>
      </a>

      <!-- 실시간 시계 & 날짜 -->
      <div class="datetime-badge" id="datetime-badge">
        <span class="clock-icon">🕒</span>
        <span id="current-time">--:--</span>
        <span class="date-sep">|</span>
        <span id="current-date">----년 --월 --일</span>
      </div>
    </div>

    <div class="nav-right">
      <!-- 날씨 새로고침 버튼 -->
      <button class="icon-button" id="refresh-weather-btn" title="날씨 새로고침" aria-label="날씨 새로고침">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>

      <!-- 테마 토글 버튼 -->
      <button class="icon-button theme-toggle" id="theme-toggle" title="화면 테마 변경" aria-label="테마 변경">
        <span class="theme-icon light-icon">☀️</span>
        <span class="theme-icon dark-icon">🌙</span>
      </button>

      <!-- 구글 앱 메뉴 아이콘 느낌 데코 -->
      <button class="icon-button" title="Google 앱" aria-label="Google 앱">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>

      <!-- 프로필 아바타 느낌 데코 -->
      <div class="user-avatar" title="사용자 계정">
        <span>G</span>
      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="main-container">
    <!-- 검색창 (Google 검색 엔진) -->
    <div class="search-section">
      <form class="search-box" id="search-form" action="https://www.google.com/search" method="GET">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#9aa0a6">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </div>

        <input 
          type="text" 
          id="search-input" 
          name="q" 
          autocomplete="off" 
          autofocus 
          placeholder="Google 검색 또는 웹 주소 입력" 
          aria-label="Google 검색"
        >

        <div class="search-actions-right">
          <!-- 음성 검색 데코 아이콘 -->
          <button type="button" class="voice-search-btn" title="음성 검색" aria-label="음성 검색">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path fill="#34a853" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
          <!-- 렌즈 아이콘 데코 -->
          <button type="button" class="lens-search-btn" title="이미지로 검색" aria-label="이미지로 검색">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 14H4V7h4.05l1.83-2h4.24l1.83 2H20v12z"/>
              <path fill="#EA4335" d="M12 17c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3z"/>
            </svg>
          </button>
        </div>
      </form>

      <div class="search-buttons">
        <button type="submit" form="search-form" class="google-btn">Google 검색</button>
        <button type="button" id="lucky-btn" class="google-btn">오늘의 행운 (I'm Feeling Lucky)</button>
      </div>
    </div>

    <!-- 오늘의 명언 섹션 -->
    <section class="quote-section" aria-label="오늘의 명언">
      <div class="quote-card">
        <div class="quote-icon-box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/>
          </svg>
        </div>
        <div class="quote-content">
          <p class="quote-text" id="quote-text">잠시만 기다려주세요, 오늘의 명언을 불러오는 중입니다...</p>
          <span class="quote-author" id="quote-author"></span>
        </div>
        <button class="quote-refresh-btn" id="refresh-quote-btn" title="새로운 명언 보기" aria-label="새로운 명언 보기">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- 오늘의 날씨 섹션 [서울, 제주] -->
    <section class="weather-section" aria-label="오늘의 날씨">
      <div class="section-title">
        <span class="section-title-icon">🌤️</span>
        <h2>오늘의 날씨</h2>
        <span class="weather-update-tag" id="weather-update-tag">실시간</span>
      </div>

      <div class="weather-grid">
        <!-- 서울 날씨 카드 -->
        <article class="weather-card" id="weather-seoul">
          <div class="weather-header">
            <div class="city-info">
              <span class="city-pin">📍</span>
              <h3 class="city-name">서울</h3>
              <span class="city-eng">Seoul</span>
            </div>
            <div class="weather-badge status-loading" id="seoul-status-badge">조회 중</div>
          </div>

          <div class="weather-body">
            <div class="weather-icon-temp">
              <div class="weather-icon" id="seoul-icon">
                <div class="spinner"></div>
              </div>
              <div class="temp-box">
                <span class="current-temp" id="seoul-temp">--°</span>
                <span class="weather-desc" id="seoul-desc">날씨 정보 로딩 중</span>
              </div>
            </div>

            <div class="weather-details">
              <div class="detail-item">
                <span class="detail-label">최고 / 최저</span>
                <span class="detail-value" id="seoul-range">--° / --°</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">습도</span>
                <span class="detail-value" id="seoul-humidity">--%</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">풍속</span>
                <span class="detail-value" id="seoul-wind">-- m/s</span>
              </div>
            </div>
          </div>
        </article>

        <!-- 제주 날씨 카드 -->
        <article class="weather-card" id="weather-jeju">
          <div class="weather-header">
            <div class="city-info">
              <span class="city-pin">📍</span>
              <h3 class="city-name">제주</h3>
              <span class="city-eng">Jeju</span>
            </div>
            <div class="weather-badge status-loading" id="jeju-status-badge">조회 중</div>
          </div>

          <div class="weather-body">
            <div class="weather-icon-temp">
              <div class="weather-icon" id="jeju-icon">
                <div class="spinner"></div>
              </div>
              <div class="temp-box">
                <span class="current-temp" id="jeju-temp">--°</span>
                <span class="weather-desc" id="jeju-desc">날씨 정보 로딩 중</span>
              </div>
            </div>

            <div class="weather-details">
              <div class="detail-item">
                <span class="detail-label">최고 / 최저</span>
                <span class="detail-value" id="jeju-range">--° / --°</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">습도</span>
                <span class="detail-value" id="jeju-humidity">--%</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">풍속</span>
                <span class="detail-value" id="jeju-wind">-- m/s</span>
              </div>
            </div>
          </div>
        </article>
      </div>
    </section>

    <!-- 빠른 바로가기 (Google 시작페이지 느낌) -->
    <section class="shortcuts-section" aria-label="바로가기">
      <div class="shortcuts-grid">
        <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer" class="shortcut-item">
          <div class="shortcut-icon icon-gmail">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="#EA4335" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </div>
          <span class="shortcut-title">Gmail</span>
        </a>

        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="shortcut-item">
          <div class="shortcut-icon icon-youtube">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="#FF0000" d="M21.58 7.19a2.506 2.506 0 0 0-1.76-1.77C18.26 5 12 5 12 5s-6.26 0-7.82.42c-.86.23-1.54.91-1.76 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.87.9 1.54 1.76 1.77C5.74 19 12 19 12 19s6.26 0 7.82-.42c.86-.23 1.53-.9 1.76-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/>
            </svg>
          </div>
          <span class="shortcut-title">YouTube</span>
        </a>

        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" class="shortcut-item">
          <div class="shortcut-icon icon-maps">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="#34A853" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <span class="shortcut-title">지도</span>
        </a>

        <a href="https://www.naver.com" target="_blank" rel="noopener noreferrer" class="shortcut-item">
          <div class="shortcut-icon icon-naver">
            <span style="font-weight: 800; color: #03C75A; font-size: 16px;">N</span>
          </div>
          <span class="shortcut-title">네이버</span>
        </a>

        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="shortcut-item">
          <div class="shortcut-icon icon-github">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </div>
          <span class="shortcut-title">GitHub</span>
        </a>
      </div>
    </section>
  </main>

  <!-- 하단 푸터 (Google 스타일) -->
  <footer class="footer">
    <div class="footer-country">대한민국</div>
    <div class="footer-links">
      <div class="footer-left-links">
        <a href="https://about.google" target="_blank" rel="noopener noreferrer">Google 정보</a>
        <a href="https://ads.google.com" target="_blank" rel="noopener noreferrer">광고</a>
        <a href="https://www.google.com/services" target="_blank" rel="noopener noreferrer">비즈니스</a>
      </div>
      <div class="footer-right-links">
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>
        <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">약관</a>
        <span class="footer-copy">© 시작 홈페이지</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
